<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Path S — Reference Match</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #f7f5f0; padding: 2.5rem; color: #1b4d3e; }
    h1 { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2rem; color: #6d9479; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 820px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #e5e0d5; border-radius: 8px; padding: 2rem; }
    .card.full { grid-column: 1 / -1; text-align: center; }
    .card h2 { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: #8a9a90; margin-bottom: 1.25rem; }
    .card img { max-width: 100%; height: auto; }
    .card.full img { max-width: 320px; }
  </style>
</head>
<body>
  <h1>Concept C — Stream Path S (Reference Match)</h1>
  <div class="grid">
    <div class="card full">
      <h2>Primary Stacked</h2>
      <img src="logo-full-stacked.svg" alt="Stacked logo"/>
    </div>
    <div class="card">
      <h2>D · Full Logo Horizontal</h2>
      <img src="logo-horizontal.svg" alt="Horizontal logo"/>
    </div>
    <div class="card">
      <h2>E · Icon Only</h2>
      <img src="logo-icon-only.svg" alt="Icon only" width="140"/>
    </div>
  </div>
</body>
</html>
