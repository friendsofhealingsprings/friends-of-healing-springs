<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <title>Concept B  Watershed Contour</title>
  <!-- Outer basin contour -->
  <ellipse cx="24" cy="26" rx="19" ry="15" stroke="currentColor" stroke-width="2" opacity="0.35"/>
  <!-- Mid contour -->
  <ellipse cx="24" cy="26" rx="13" ry="10" stroke="currentColor" stroke-width="2" opacity="0.6"/>
  <!-- Inner contour -->
  <ellipse cx="24" cy="26" rx="7" ry="5.5" stroke="currentColor" stroke-width="2.5"/>
  <!-- Spring origin -->
  <circle cx="24" cy="26" r="2.5" fill="currentColor"/>
</svg>
